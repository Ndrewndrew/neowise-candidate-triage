<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="result" role="status"></p>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");
    const topicLabels = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const manualReview = "Нужен ручной разбор. Выберите тему и подготовьте ответ по тексту заявки.";

    function clearResult() {
      result.textContent = "";
      message.removeAttribute("aria-invalid");
      message.removeAttribute("aria-describedby");
    }

    function showInputError() {
      result.textContent = "Введите текст заявки.";
      message.setAttribute("aria-invalid", "true");
      message.setAttribute("aria-describedby", "result");
      message.focus();
    }

    message.addEventListener("input", clearResult);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      clearResult();
      const text = message.value.trim();
      if (!text) {
        showInputError();
        return;
      }

      button.disabled = true;
      message.readOnly = true;
      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5_000),
        });
        const data = await reply.json();
        if (reply.status === 400 && data?.status === "invalid_input") {
          showInputError();
        } else if (reply.ok && data?.status === "ready" &&
          typeof data.topic === "string" && Object.hasOwn(topicLabels, data.topic) &&
          typeof data.draft === "string" && data.draft.trim()) {
          result.textContent = `Тема: ${topicLabels[data.topic]}\n\nЧерновик ответа:\n${data.draft}`;
        } else {
          result.textContent = manualReview;
        }
      } catch {
        result.textContent = manualReview;
      } finally {
        button.disabled = false;
        message.readOnly = false;
      }
    });
  </script>
</body>
</html>
